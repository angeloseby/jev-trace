receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  logging:
    verbosity: detailed
  # JevTrace API as OTLP endpoint — we expose /api/v1/otlp/traces
  otlphttp/jev:
    endpoint: http://api:8000
    traces_endpoint: http://api:8000/api/v1/otlp/traces
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging, otlphttp/jev]
  telemetry:
    logs:
      level: info
