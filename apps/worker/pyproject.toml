[project]
name = "jev-trace-worker"
version = "0.1.0"
description = "Celery worker for JevTrace"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.3",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "typesafe-sdk>=0.7.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
