name: ci
on: [push, pull_request]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff mypy pytest pytest-asyncio httpx fastapi pydantic pydantic-settings sqlalchemy asyncpg alembic python-jose passlib redis typesafe-sdk
      - run: cp .env.example .env
      - run: ruff check apps/ packages/
      - run: pytest tests/unit tests/integration -q
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.JEV_API_KEY }}
  build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd apps/dashboard && npm install && npm run build
