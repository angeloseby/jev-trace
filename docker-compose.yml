services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jev
      POSTGRES_PASSWORD: jev
      POSTGRES_DB: jevtrace
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jev -d jevtrace"]
      interval: 5s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  api:
    build: { context: ., dockerfile: infra/docker/Dockerfile.api }
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://jev:jev@postgres:5432/jevtrace
      SYNC_DATABASE_URL: postgresql://jev:jev@postgres:5432/jevtrace
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: { context: ., dockerfile: infra/docker/Dockerfile.worker }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://jev:jev@postgres:5432/jevtrace
      SYNC_DATABASE_URL: postgresql://jev:jev@postgres:5432/jevtrace
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: celery -A app.celery_app worker --loglevel=info

  dashboard:
    build: { context: ., dockerfile: infra/docker/Dockerfile.dashboard }
    ports: ["3000:3000"]
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  postgres-data:
