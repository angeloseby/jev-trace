services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jev
      POSTGRES_PASSWORD: jev
      POSTGRES_DB: jevtrace
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: { context: ., dockerfile: infra/docker/Dockerfile.api }
    ports: ["8000:8000"]
    env_file: [.env]
    depends_on: [postgres, redis]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: { context: ., dockerfile: infra/docker/Dockerfile.worker }
    env_file: [.env]
    depends_on: [postgres, redis]
    command: celery -A app.celery_app worker --loglevel=info

  dashboard:
    build: { context: ., dockerfile: infra/docker/Dockerfile.dashboard }
    ports: ["3000:3000"]
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  postgres-data:
