[project]
name = "jev-trace"
version = "0.1.0"
description = "JevTrace tracer — 3-line integration for any agent, LangChain/LangGraph auto-tracing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
optional-dependencies = { langchain = ["langchain-core>=0.2"], langgraph = ["langgraph>=0.2"] }
keywords = ["jev", "tracing", "langchain", "langgraph", "otel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_trace"]
